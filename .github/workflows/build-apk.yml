name: Build Babylon Lion APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Localizar arquivos do Babylon Lion
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo " PROCURANDO 2.HTML"
          echo "========================================"

          GAME_HTML=$(find . -type f -name "2.html" -print -quit)

          if [ -z "$GAME_HTML" ]; then
            echo "ERRO: 2.html não foi encontrado."
            echo ""
            echo "Arquivos HTML encontrados:"
            find . -type f \( -name "*.html" -o -name "*.htm" \) | sort
            exit 1
          fi

          echo "2.html encontrado em:"
          echo "$GAME_HTML"

          echo ""
          echo "========================================"
          echo " PROCURANDO AS IMAGENS DO LEÃO"
          echo "========================================"

          LION_DIR=$(find . -type d -path "*/asset/lion" -print -quit)

          if [ -z "$LION_DIR" ]; then
            LION_DIR=$(find . -type d -path "*/assets/lion" -print -quit)
          fi

          if [ -z "$LION_DIR" ]; then
            echo "ERRO: pasta lion não encontrada."
            echo ""
            echo "Pastas encontradas:"
            find . -type d \( -name "lion" -o -name "asset" -o -name "assets" \) | sort
            exit 1
          fi

          echo "Pasta lion encontrada em:"
          echo "$LION_DIR"

          echo ""
          echo "Quantidade de imagens:"
          find "$LION_DIR" -type f -name "*.png" | wc -l

          echo ""
          echo "Arquivos:"
          find "$LION_DIR" -type f | sort

          echo ""
          echo "========================================"
          echo " PROCURANDO A MÚSICA"
          echo "========================================"

          MUSIC_FILE=$(find . -type f -name "babylon_mp3_58926.mp3" -print -quit)

          if [ -z "$MUSIC_FILE" ]; then
            echo "ERRO: babylon_mp3_58926.mp3 não foi encontrado."
            echo ""
            echo "Arquivos MP3 encontrados:"
            find . -type f -iname "*.mp3" | sort
            exit 1
          fi

          echo "Música encontrada em:"
          echo "$MUSIC_FILE"

          echo ""
          echo "========================================"
          echo " SALVANDO CAMINHOS"
          echo "========================================"

          echo "GAME_HTML=$GAME_HTML" >> "$GITHUB_ENV"
          echo "LION_DIR=$LION_DIR" >> "$GITHUB_ENV"
          echo "MUSIC_FILE=$MUSIC_FILE" >> "$GITHUB_ENV"

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Criar projeto Android
        run: |
          mkdir -p app/src/main/java/com/maribone/babylonlion
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BabylonLion"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.maribone.babylonlion'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.maribone.babylonlion'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="Babylon Lion"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:windowFullscreen">true</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/java/com/maribone/babylonlion/MainActivity.java <<'EOF'
          package com.maribone.babylonlion;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setFlags(
                      android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);

                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());

                  webView.setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );

                  setContentView(webView);

                  webView.loadUrl(
                      "file:///android_asset/2.html"
                  );
              }

              @Override
              public void onBackPressed() {
              }
          }
          EOF

      - name: Copiar jogo para dentro do APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo " EMPACOTANDO BABYLON LION"
          echo "========================================"

          cp "$GAME_HTML" app/src/main/assets/2.html

          GAME_DIR=$(dirname "$GAME_HTML")

          echo "Diretório do 2.html:"
          echo "$GAME_DIR"

          echo ""
          echo "Copiando pasta asset..."

          if [ -d "$GAME_DIR/asset" ]; then
              cp -R "$GAME_DIR/asset" app/src/main/assets/
              echo "asset encontrado junto do 2.html."
          elif [ -d "$GAME_DIR/assets" ]; then
              cp -R "$GAME_DIR/assets" app/src/main/assets/asset
              echo "assets encontrado junto do 2.html."
          else
              ASSET_DIR=$(dirname "$LION_DIR")

              if [ "$(basename "$ASSET_DIR")" = "asset" ]; then
                  mkdir -p app/src/main/assets/asset
                  cp -R "$ASSET_DIR/." app/src/main/assets/asset/
                  echo "asset localizado através da pasta lion."
              else
                  echo "ERRO: não consegui determinar a pasta asset."
                  exit 1
              fi
          fi

          echo ""
          echo "========================================"
          echo " CONTEÚDO EMPACOTADO"
          echo "========================================"

          find app/src/main/assets -type f | sort

      - name: Validar conteúdo do APK
        run: |
          set -e

          echo "Verificando 2.html..."
          test -f app/src/main/assets/2.html

          echo "Verificando imagens..."

          IMAGE_COUNT=$(find app/src/main/assets/asset/lion \
            -type f \
            -name "*.png" | wc -l)

          echo "Imagens encontradas: $IMAGE_COUNT"

          if [ "$IMAGE_COUNT" -lt 25 ]; then
            echo "ERRO: menos de 25 imagens encontradas."
            exit 1
          fi

          echo "Verificando música..."
          test -f app/src/main/assets/asset/music/babylon_mp3_58926.mp3

          echo ""
          echo "========================================"
          echo " TODOS OS ARQUIVOS ESTÃO PRESENTES"
          echo "========================================"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Verificar APK
        run: |
          echo "========================================"
          echo " APK GERADO"
          echo "========================================"

          ls -lh app/build/outputs/apk/debug/app-debug.apk

          echo ""
          echo "Tamanho:"
          du -h app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Babylon-Lion-APK
          path: app/build/outputs/apk/debug/app-debug.apk

name: Build Babylon Lion APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Verificar estrutura do jogo
        run: |
          echo "=== ESTRUTURA DO PROJETO ==="
          test -f 2.html
          test -d asset/lion
          test -d asset/music
          test -f asset/music/babylon_mp3_58926.mp3

          echo "2.html encontrado:"
          ls -lh 2.html

          echo "Imagens do leão:"
          find asset/lion -type f | sort

          echo "Quantidade de imagens:"
          find asset/lion -type f -name "*.png" | wc -l

          echo "Música:"
          ls -lh asset/music/

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Criar projeto Android
        run: |
          mkdir -p app/src/main/java/com/maribone/babylonlion
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BabylonLion"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.maribone.babylonlion'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.maribone.babylonlion'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="Babylon Lion"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:fontFamily">sans</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/java/com/maribone/babylonlion/MainActivity.java <<'EOF'
          package com.maribone.babylonlion;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setFlags(
                      android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);

                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  // Permite reprodução automática de áudio dentro do APK.
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setSupportZoom(false);

                  webView.setWebViewClient(new WebViewClient());

                  webView.setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );

                  setContentView(webView);

                  /*
                   * IMPORTANTE:
                   * O jogo NÃO é carregado pela internet.
                   *
                   * O arquivo 2.html e a pasta asset/
                   * estarão dentro do próprio APK.
                   */
                  webView.loadUrl(
                      "file:///android_asset/2.html"
                  );
              }

              @Override
              public void onBackPressed() {
                  // Bloqueia o botão voltar para manter o jogo em tela cheia.
              }
          }
          EOF

      - name: Empacotar jogo dentro do APK
        run: |
          echo "=== COPIANDO JOGO PARA O APK ==="

          cp 2.html app/src/main/assets/2.html

          mkdir -p app/src/main/assets/asset

          cp -R asset/. app/src/main/assets/asset/

          echo "=== CONTEÚDO DOS ASSETS DO APK ==="
          find app/src/main/assets -type f | sort

      - name: Verificar arquivos do jogo dentro do projeto Android
        run: |
          echo "=== 2.HTML ==="
          ls -lh app/src/main/assets/2.html

          echo "=== IMAGENS ==="
          find app/src/main/assets/asset/lion \
            -type f \
            -name "*.png" | sort

          echo "=== TOTAL DE IMAGENS ==="
          find app/src/main/assets/asset/lion \
            -type f \
            -name "*.png" | wc -l

          echo "=== MÚSICA ==="
          ls -lh app/src/main/assets/asset/music/

          test -f app/src/main/assets/asset/music/babylon_mp3_58926.mp3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Verificar APK gerado
        run: |
          echo "=== APK GERADO ==="
          ls -lh app/build/outputs/apk/debug/app-debug.apk

          echo "=== TAMANHO DO APK ==="
          du -h app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Babylon-Lion-APK
          path: app/build/outputs/apk/debug/app-debug.apk

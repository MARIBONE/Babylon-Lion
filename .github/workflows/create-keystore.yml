name: Create Babylon Lion Keystore

on:
  workflow_dispatch:

jobs:

  create-keystore:

    runs-on: ubuntu-latest

    steps:

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Create production keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BABYLON_KEYSTORE_PASSWORD }}
        run: |
          set -e

          keytool \
            -genkeypair \
            -v \
            -keystore maribone-babylon-lion.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -alias babylon-lion \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MARIBONE TECNOLOGIA, OU=MARIBONE, O=MARIBONE TECNOLOGIA, L=Itaquaquecetuba, ST=Sao Paulo, C=BR"

          echo ""
          echo "=========================================="
          echo "KEYSTORE CREATED"
          echo "=========================================="

          keytool \
            -list \
            -v \
            -keystore maribone-babylon-lion.jks \
            -storepass "$KEYSTORE_PASSWORD"

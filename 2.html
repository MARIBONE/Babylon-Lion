<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Babylon Lion</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#08090d;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    max-width:1400px;
    overflow:hidden;
    background:#dfe2e6;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#hud{
    position:absolute;
    top:22px;
    left:22px;
    right:22px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    pointer-events:none;
    color:white;
    z-index:5;
}

.panel{
    background:rgba(20,18,17,.72);
    border:2px solid rgba(241,190,75,.65);
    border-radius:12px;
    padding:10px 16px;
    box-shadow:0 5px 20px rgba(0,0,0,.3);
    backdrop-filter:blur(5px);
}

.label{
    font-size:11px;
    letter-spacing:2px;
    color:#f1c35a;
    text-transform:uppercase;
}

.value{
    font-size:25px;
    font-weight:bold;
    margin-top:2px;
}

#pauseBtn{
    position:absolute;
    top:22px;
    left:50%;
    transform:translateX(-50%);
    z-index:8;

    margin:0;
    padding:10px 22px;

    border:2px solid #f3ca67;
    border-radius:999px;

    background:rgba(40,28,18,.82);

    color:#fff3c8;

    font-size:13px;
    font-weight:bold;

    letter-spacing:2px;

    cursor:pointer;

    box-shadow:
        0 5px 18px rgba(0,0,0,.35);

    backdrop-filter:blur(5px);
}

#pauseBtn:hover{
    filter:brightness(1.15);
}

#menu,
#gameover,
#pauseScreen{

    position:absolute;

    inset:0;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    z-index:10;

    background:
        radial-gradient(
            circle at center,
            rgba(120,90,35,.25),
            rgba(10,8,6,.9)
        );
}

#gameover,
#pauseScreen{
    display:none;
}

.logo{
    font-size:clamp(48px,9vw,105px);

    font-weight:900;

    letter-spacing:-5px;

    color:#f0bd4e;

    text-shadow:
        0 4px 0 #7b4515,
        0 8px 25px rgba(0,0,0,.8);
}

.subtitle{
    margin-top:-5px;

    color:#fff1c8;

    font-size:
        clamp(
            13px,
            2vw,
            20px
        );

    letter-spacing:6px;

    text-transform:uppercase;
}

button{
    margin-top:35px;

    padding:16px 42px;

    border:2px solid #f3ca67;

    border-radius:999px;

    background:
        linear-gradient(
            #d99a30,
            #9b5c16
        );

    color:white;

    font-size:18px;

    font-weight:bold;

    letter-spacing:2px;

    cursor:pointer;

    box-shadow:
        0 7px 20px rgba(0,0,0,.4);

    transition:.15s;
}

button:hover{
    transform:
        translateY(-2px)
        scale(1.03);

    filter:brightness(1.12);
}

button:active{
    transform:scale(.97);
}

.instructions{
    margin-top:18px;

    color:#d7c39a;

    font-size:13px;
}

#finalScore{

    font-size:58px;

    color:#f0bd4e;

    font-weight:900;

    margin-top:8px;
}

#bestScore{

    color:#ddd;

    margin-top:4px;
}

#pauseTitle{

    color:#f0bd4e;

    font-size:
        clamp(
            42px,
            8vw,
            90px
        );

    font-weight:900;

    letter-spacing:-3px;

    text-shadow:
        0 4px 0 #704015;
}

#pauseHint{

    margin-top:12px;

    color:#fff1c8;

    letter-spacing:3px;

    font-size:13px;
}

@media(max-width:700px){

    #hud{

        top:10px;

        left:10px;

        right:10px;
    }

    .panel{

        padding:
            7px
            11px;
    }

    .value{

        font-size:19px;
    }

    #pauseBtn{

        top:10px;

        padding:
            8px
            14px;

        font-size:11px;
    }

    .logo{

        letter-spacing:-3px;
    }
}

</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>


<!-- =====================================================
     HUD
===================================================== -->

<div id="hud">

    <div class="panel">

        <div class="label">
            Pontuação
        </div>

        <div
            class="value"
            id="score"
        >
            0
        </div>

    </div>


    <div class="panel">

        <div class="label">
            Recorde
        </div>

        <div
            class="value"
            id="best"
        >
            0
        </div>

    </div>

</div>


<!-- =====================================================
     PAUSE
===================================================== -->

<button id="pauseBtn">
    PAUSE
</button>


<!-- =====================================================
     MENU
===================================================== -->

<div id="menu">

    <div class="logo">
        BABYLON
    </div>

    <div class="subtitle">
        LION
    </div>

    <button id="startBtn">
        ENTRAR NA ARENA
    </button>

    <div class="instructions">
        Toque na tela para saltar
    </div>

</div>


<!-- =====================================================
     GAME OVER
===================================================== -->

<div id="gameover">

    <div class="subtitle">
        O LEÃO CAIU
    </div>

    <div id="finalScore">
        0
    </div>

    <div class="instructions">
        PONTOS
    </div>

    <div id="bestScore">
        Recorde: 0
    </div>

    <button id="restartBtn">
        CORRER NOVAMENTE
    </button>

</div>


<!-- =====================================================
     PAUSE SCREEN
===================================================== -->

<div id="pauseScreen">

    <div id="pauseTitle">
        PAUSADO
    </div>

    <div id="pauseHint">
        TOQUE EM CONTINUAR PARA VOLTAR À ARENA
    </div>

    <button id="resumeBtn">
        CONTINUAR
    </button>

</div>


<script>

/* =========================================================
   TELA CHEIA
========================================================= */

function enterFullscreenAndLock(){

    const elem=
        document.documentElement;

    if(
        elem.requestFullscreen
    ){

        elem.requestFullscreen()
        .catch(()=>{});
    }

    else if(
        elem.webkitRequestFullscreen
    ){

        elem.webkitRequestFullscreen();
    }

    if(
        screen.orientation &&
        screen.orientation.lock
    ){

        screen.orientation
            .lock("landscape")
            .catch(()=>{});
    }
}


/* =========================================================
   CANVAS
========================================================= */

const canvas=
    document.getElementById(
        "canvas"
    );

const ctx=
    canvas.getContext("2d");

let W;
let H;


/* =========================================================
   ESTADO
========================================================= */

let running=false;

let paused=false;

let lastTime=0;

let score=0;

let best=
    Number(
        localStorage.getItem(
            "babylonLionBest"
        ) || 0
    );

let speed=14;

let distance=0;

let obstacles=[];

let coins=[];

let particles=[];

let spawnTimer=2.8;

let coinTimer=.35;

const groundHeight=115;


/* =========================================================
   LEÃO
========================================================= */

const lion={

    x:160,

    y:0,

    width:115,

    height:95,

    vy:0,

    gravity:1650,

    jumpPower:-900,

    grounded:true,

    duck:false,

    frame:0

};


document.getElementById(
    "best"
).textContent=best;


/* =========================================================
   RESIZE
========================================================= */

function resize(){

    W=
        canvas.width=
        canvas.clientWidth*
        devicePixelRatio;

    H=
        canvas.height=
        canvas.clientHeight*
        devicePixelRatio;

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );

    W=canvas.clientWidth;

    H=canvas.clientHeight;

    lion.y=
        H-
        groundHeight-
        lion.height;
}

window.addEventListener(
    "resize",
    resize
);

resize();


function groundY(){

    return H-
        groundHeight;
}


/* =========================================================
   INICIAR JOGO
========================================================= */

function startGame(){

    running=true;

    paused=false;

    score=0;

    distance=0;

    /*
       VELOCIDADE 2X
    */

    speed=14;

    obstacles=[];

    coins=[];

    particles=[];

    /*
       PRIMEIRO OBSTÁCULO
       BEM DISTANTE
    */

    spawnTimer=4.0;

    /*
       MOEDAS COMEÇAM CEDO
    */

    coinTimer=.25;

    lion.y=
        groundY()-
        lion.height;

    lion.vy=0;

    lion.grounded=true;

    lion.duck=false;

    document.getElementById(
        "menu"
    ).style.display="none";

    document.getElementById(
        "gameover"
    ).style.display="none";

    document.getElementById(
        "pauseScreen"
    ).style.display="none";

    document.getElementById(
        "pauseBtn"
    ).style.display="block";

    lastTime=
        performance.now();

    requestAnimationFrame(loop);
}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver(){

    running=false;

    paused=false;

    if(
        score>best
    ){

        best=score;

        localStorage.setItem(
            "babylonLionBest",
            best
        );
    }

    document.getElementById(
        "finalScore"
    ).textContent=score;

    document.getElementById(
        "bestScore"
    ).textContent=
        "Recorde: "+best;

    document.getElementById(
        "best"
    ).textContent=best;

    document.getElementById(
        "gameover"
    ).style.display="flex";

    document.getElementById(
        "pauseBtn"
    ).style.display="none";
}


/* =========================================================
   PAUSE
========================================================= */

function pauseGame(){

    if(!running){
        return;
    }

    paused=true;

    document.getElementById(
        "pauseScreen"
    ).style.display="flex";
}


function resumeGame(){

    if(!running){
        return;
    }

    paused=false;

    document.getElementById(
        "pauseScreen"
    ).style.display="none";

    lastTime=
        performance.now();

    requestAnimationFrame(loop);
}


document.getElementById(
    "pauseBtn"
).addEventListener(
    "click",
    e=>{

        e.stopPropagation();

        pauseGame();
    }
);


document.getElementById(
    "resumeBtn"
).addEventListener(
    "click",
    e=>{

        e.stopPropagation();

        resumeGame();
    }
);


/* =========================================================
   SALTO
========================================================= */

function jump(){

    if(
        !running ||
        paused
    ){
        return;
    }

    if(
        lion.grounded
    ){

        lion.vy=
            lion.jumpPower;

        lion.grounded=false;


        for(
            let i=0;
            i<12;
            i++
        ){

            particles.push({

                x:
                    lion.x+
                    50+
                    Math.random()*50,

                y:
                    groundY()-5,

                vx:
                    -Math.random()*180,

                vy:
                    -50-
                    Math.random()*180,

                life:
                    .55+
                    Math.random()*.25
            });
        }
    }
}


/* =========================================================
   TOQUE NA TELA = PULO
========================================================= */

document.addEventListener(
    "touchstart",
    function(e){

        /*
           Não interfere nos menus
           nem no botão de pause.
        */

        if(
            e.target.closest(
                "button"
            )
        ){

            return;
        }

        if(
            running &&
            !paused
        ){

            e.preventDefault();

            jump();
        }

    },
    {
        passive:false
    }
);


/*
   Também permite clique no desktop
   durante a partida.
*/

canvas.addEventListener(
    "mousedown",
    function(){

        if(
            running &&
            !paused
        ){

            jump();
        }
    }
);


/* =========================================================
   TECLADO
========================================================= */

window.addEventListener(
    "keydown",
    e=>{

        if(
            e.code==="Space" ||
            e.code==="ArrowUp"
        ){

            e.preventDefault();

            jump();
        }


        if(
            e.code==="Enter" &&
            !running
        ){

            startGame();
        }


        if(
            e.code==="KeyP" ||
            e.code==="Escape"
        ){

            if(
                running &&
                !paused
            ){

                pauseGame();
            }

            else if(
                running &&
                paused
            ){

                resumeGame();
            }
        }
    }
);


document.getElementById(
    "startBtn"
).onclick=e=>{

    e.stopPropagation();

    enterFullscreenAndLock();

    startGame();
};


document.getElementById(
    "restartBtn"
).onclick=e=>{

    e.stopPropagation();

    enterFullscreenAndLock();

    startGame();
};


/* =========================================================
   ALTARES BABILÔNICOS
========================================================= */

function spawnObstacle(){

    const tall=
        Math.random()<.6;


    obstacles.push({

        /*
           ALTAR COMEÇA LONGE
        */

        x:
            W+260,

        y:
            groundY()-
            (
                tall
                ? 105
                : 85
            ),

        width:
            tall
            ? 82
            : 100,

        height:
            tall
            ? 105
            : 85,

        type:
            tall
            ? "altar"
            : "altarLow",

        flame:
            Math.random()*
            Math.PI*
            2
    });
}


/* =========================================================
   MOEDAS
========================================================= */

function createCoin(
    x,
    y
){

    coins.push({

        x:x,

        y:y,

        r:12,

        spin:
            Math.random()*
            Math.PI*
            2
    });
}


/* =========================================================
   PADRÕES DE MOEDAS
========================================================= */

function spawnCoin(){

    const pattern=
        Math.floor(
            Math.random()*6
        );


    /*
       LINHA
    */

    if(
        pattern===0
    ){

        const y=
            groundY()-
            105-
            Math.random()*70;

        for(
            let i=0;
            i<7;
            i++
        ){

            createCoin(
                W+50+i*42,
                y
            );
        }
    }


    /*
       ESCADA SUBINDO
    */

    else if(
        pattern===1
    ){

        const base=
            groundY()-75;

        for(
            let i=0;
            i<8;
            i++
        ){

            createCoin(
                W+50+i*42,
                base-i*24
            );
        }
    }


    /*
       ESCADA DESCENDO
    */

    else if(
        pattern===2
    ){

        const base=
            groundY()-205;

        for(
            let i=0;
            i<8;
            i++
        ){

            createCoin(
                W+50+i*42,
                base+i*24
            );
        }
    }


    /*
       ARCO
    */

    else if(
        pattern===3
    ){

        const centerX=
            W+180;

        const centerY=
            groundY()-125;

        for(
            let i=0;
            i<10;
            i++
        ){

            const angle=
                Math.PI-
                (
                    Math.PI*i/9
                );

            const radius=120;

            createCoin(

                centerX+
                Math.cos(angle)*
                radius,

                centerY-
                Math.sin(angle)*
                radius
            );
        }
    }


    /*
       ONDA
    */

    else if(
        pattern===4
    ){

        for(
            let i=0;
            i<11;
            i++
        ){

            createCoin(

                W+50+i*38,

                groundY()-
                115-
                Math.sin(i*.75)*
                45
            );
        }
    }


    /*
       LONGA SEQUÊNCIA
    */

    else{

        for(
            let i=0;
            i<13;
            i++
        ){

            createCoin(

                W+40+i*38,

                groundY()-
                95-
                Math.sin(i*.55)*
                70
            );
        }
    }
}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

    distance+=
        speed*
        dt;


    score=
        Math.floor(
            distance/10
        );


    /*
       VELOCIDADE MANTÉM O DOBRO
       E AUMENTA GRADUALMENTE.
    */

    speed=
        14+
        Math.min(
            12,
            score/180
        );


    document.getElementById(
        "score"
    ).textContent=score;


    /* -----------------------------------------------------
       FÍSICA
    ----------------------------------------------------- */

    lion.frame+=
        dt*12;

    lion.vy+=
        lion.gravity*
        dt;

    lion.y+=
        lion.vy*
        dt;


    const targetGround=
        groundY()-
        lion.height;


    if(
        lion.y>=targetGround
    ){

        lion.y=
            targetGround;

        lion.vy=0;

        lion.grounded=true;
    }


    /* -----------------------------------------------------
       OBSTÁCULOS
    ----------------------------------------------------- */

    spawnTimer-=dt;


    if(
        spawnTimer<=0
    ){

        spawnObstacle();


        /*
           ESPAÇAMENTO GRANDE
           PARA COMPENSAR 2X DE VELOCIDADE
        */

        spawnTimer=
            Math.max(
                1.7,
                3.3-
                Math.min(
                    1.1,
                    score/500
                )
            )+
            Math.random()*1.4;
    }


    /* -----------------------------------------------------
       MOEDAS
    ----------------------------------------------------- */

    coinTimer-=dt;


    if(
        coinTimer<=0
    ){

        spawnCoin();

        coinTimer=
            .55+
            Math.random()*.65;
    }


    /* -----------------------------------------------------
       MOVIMENTO
    ----------------------------------------------------- */

    for(
        const o of obstacles
    ){

        o.x-=
            speed*
            60*
            dt;

        o.flame+=
            dt*8;
    }


    for(
        const c of coins
    ){

        c.x-=
            speed*
            60*
            dt;

        c.spin+=
            dt*7;
    }


    obstacles=
        obstacles.filter(
            o=>o.x>-180
        );


    coins=
        coins.filter(
            c=>c.x>-70
        );


    checkCollisions();


    /* -----------------------------------------------------
       PARTÍCULAS
    ----------------------------------------------------- */

    for(
        const p of particles
    ){

        p.x+=
            p.vx*
            dt;

        p.y+=
            p.vy*
            dt;

        p.vy+=
            400*
            dt;

        p.life-=dt;
    }


    particles=
        particles.filter(
            p=>p.life>0
        );
}


/* =========================================================
   COLISÕES
========================================================= */

function checkCollisions(){

    const lx=
        lion.x+20;

    const ly=
        lion.y+12;

    const lw=
        lion.width-35;

    const lh=
        lion.height-15;


    for(
        const o of obstacles
    ){

        const hit=

            lx<
            o.x+
            o.width-
            8

            &&

            lx+
            lw>
            o.x+
            8

            &&

            ly<
            o.y+
            o.height

            &&

            ly+
            lh>
            o.y+
            10;


        if(hit){

            gameOver();

            return;
        }
    }


    /*
       COLETA DE MOEDAS
    */

    for(
        let i=
            coins.length-1;
        i>=0;
        i--
    ){

        const c=
            coins[i];


        const dx=
            (
                lion.x+
                lion.width/2
            )-
            c.x;


        const dy=
            (
                lion.y+
                lion.height/2
            )-
            c.y;


        if(
            Math.sqrt(
                dx*dx+
                dy*dy
            )<65
        ){

            score+=25;

            distance+=250;


            for(
                let j=0;
                j<16;
                j++
            ){

                particles.push({

                    x:c.x,

                    y:c.y,

                    vx:
                        (
                            Math.random()-
                            .5
                        )*
                        220,

                    vy:
                        (
                            Math.random()-
                            .5
                        )*
                        220,

                    life:
                        .6+
                        Math.random()*.3
                });
            }


            coins.splice(
                i,
                1
            );
        }
    }
}


/* =========================================================
   CÉU BABILÔNICO
========================================================= */

function drawSky(){

    const g=
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );


    g.addColorStop(
        0,
        "#101d35"
    );

    g.addColorStop(
        .45,
        "#274b72"
    );

    g.addColorStop(
        1,
        "#7893a8"
    );


    ctx.fillStyle=g;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
       Tijolos distantes
    */

    ctx.strokeStyle=
        "rgba(30,45,65,.45)";

    ctx.lineWidth=2;


    const brickH=18;

    const brickW=45;


    for(
        let y=0;
        y<H;
        y+=brickH
    ){

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            W,
            y
        );

        ctx.stroke();


        const offsetX=
            (
                Math.floor(
                    y/brickH
                )%2
            )*
            (
                brickW/2
            );


        for(
            let x=offsetX;
            x<W;
            x+=brickW
        ){

            ctx.beginPath();

            ctx.moveTo(
                x,
                y
            );

            ctx.lineTo(
                x,
                y+brickH
            );

            ctx.stroke();
        }
    }
}


/* =========================================================
   CIDADE BABILÔNICA
========================================================= */

function drawDistantCity(){

    const y=
        groundY();


    ctx.fillStyle=
        "#806d5c";


    for(
        let x=-50;
        x<W+100;
        x+=90
    ){

        const h=
            70+
            Math.abs(
                x*13%100
            );


        ctx.fillRect(
            x,
            y-h,
            55,
            h
        );


        ctx.fillRect(
            x+15,
            y-h-35,
            25,
            35
        );


        ctx.beginPath();

        ctx.moveTo(
            x+10,
            y-h-35
        );

        ctx.lineTo(
            x+27,
            y-h-60
        );

        ctx.lineTo(
            x+44,
            y-h-35
        );

        ctx.fill();
    }


    /*
       Zigurate
    */

    const zx=
        W*.55;


    ctx.fillStyle=
        "#a08b73";


    ctx.beginPath();

    ctx.moveTo(
        zx-180,
        y
    );

    ctx.lineTo(
        zx-120,
        y-95
    );

    ctx.lineTo(
        zx+120,
        y-95
    );

    ctx.lineTo(
        zx+180,
        y
    );

    ctx.fill();


    ctx.fillStyle=
        "#b49d7c";


    ctx.fillRect(
        zx-85,
        y-150,
        170,
        55
    );


    ctx.fillRect(
        zx-48,
        y-195,
        96,
        45
    );


    ctx.beginPath();

    ctx.moveTo(
        zx-55,
        y-195
    );

    ctx.lineTo(
        zx,
        y-240
    );

    ctx.lineTo(
        zx+55,
        y-195
    );

    ctx.fill();
}


/* =========================================================
   PISO DE MÁRMORE BRANCO
========================================================= */

function drawGround(){

    const y=
        groundY();


    /*
       Mármore base
    */

    const marble=
        ctx.createLinearGradient(
            0,
            y,
            0,
            H
        );


    marble.addColorStop(
        0,
        "#ffffff"
    );

    marble.addColorStop(
        .28,
        "#f7f7f7"
    );

    marble.addColorStop(
        .65,
        "#e5e7e9"
    );

    marble.addColorStop(
        1,
        "#bfc3c7"
    );


    ctx.fillStyle=
        marble;


    ctx.fillRect(
        0,
        y,
        W,
        groundHeight
    );


    /*
       Grandes placas
    */

    const tileW=150;

    const tileH=58;


    const offset=
        -(distance*2)%
        tileW;


    ctx.strokeStyle=
        "rgba(105,110,118,.42)";

    ctx.lineWidth=2;


    for(
        let x=offset;
        x<W+tileW;
        x+=tileW
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            y
        );

        ctx.lineTo(
            x,
            H
        );

        ctx.stroke();
    }


    for(
        let yy=y+tileH;
        yy<H;
        yy+=tileH
    ){

        ctx.beginPath();

        ctx.moveTo(
            0,
            yy
        );

        ctx.lineTo(
            W,
            yy
        );

        ctx.stroke();
    }


    /*
       Veios do mármore
    */

    ctx.strokeStyle=
        "rgba(120,125,132,.18)";

    ctx.lineWidth=3;


    for(
        let i=0;
        i<7;
        i++
    ){

        const sx=
            (
                i*230-
                distance*.8
            )%
            (W+300)-
            150;


        ctx.beginPath();

        ctx.moveTo(
            sx,
            y
        );

        ctx.bezierCurveTo(
            sx+60,
            y+30,
            sx-40,
            y+65,
            sx+100,
            H
        );

        ctx.stroke();
    }


    /*
       Faixa de brilho
    */

    const shine=
        ctx.createLinearGradient(
            0,
            y,
            0,
            y+35
        );


    shine.addColorStop(
        0,
        "rgba(255,255,255,.98)"
    );


    shine.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );


    ctx.fillStyle=
        shine;


    ctx.fillRect(
        0,
        y,
        W,
        35
    );
}

/* =========================================================
   PROCESSAMENTO DOURADO
========================================================= */

function processLionImage(
    img,
    index
){

    try{

        const off=
            document.createElement(
                "canvas"
            );

        const octx=
            off.getContext(
                "2d"
            );


        off.width=
            img.naturalWidth;

        off.height=
            img.naturalHeight;


        octx.drawImage(
            img,
            0,
            0
        );


        const imageData=
            octx.getImageData(
                0,
                0,
                off.width,
                off.height
            );


        const data=
            imageData.data;


        for(
            let i=0;
            i<data.length;
            i+=4
        ){

            const r=data[i];

            const g=data[i+1];

            const b=data[i+2];


            const brightness=
                (
                    r+
                    g+
                    b
                )/3;


            /*
               Fundo branco transparente
            */

            if(
                (
                    r>225 &&
                    g>225 &&
                    b>225
                )
                ||
                brightness>242
            ){

                data[i+3]=0;

                continue;
            }


            /*
               Ouro
            */

            const luminance=
                (
                    .299*r+
                    .587*g+
                    .114*b
                )/255;


            const darkR=72;

            const darkG=35;

            const darkB=10;


            const goldR=242;

            const goldG=180;

            const goldB=58;


            data[i]=
                darkR+
                (
                    goldR-darkR
                )*
                luminance;


            data[i+1]=
                darkG+
                (
                    goldG-darkG
                )*
                luminance;


            data[i+2]=
                darkB+
                (
                    goldB-darkB
                )*
                luminance;
        }


        octx.putImageData(
            imageData,
            0,
            0
        );


        const processed=
            new Image();


        processed.src=
            off.toDataURL(
                "image/png"
            );


        processedFrames[index]=
            processed;

    }
    catch(error){

        processedFrames[index]=
            img;

        console.log(
            "Processamento do frame falhou:",
            index,
            error
        );
    }
}


/* =========================================================
   CARREGAR LEÃO
========================================================= */

frameURLs.forEach(
    (url,index)=>{

        const img=
            new Image();

        img.crossOrigin=
            "Anonymous";


        img.onload=()=>{

            processLionImage(
                img,
                index
            );
        };


        img.onerror=()=>{

            console.log(
                "Erro ao carregar frame:",
                index
            );
        };


        img.src=url;


        lionFrames[index]=
            img;
    }
);


/* =========================================================
   DESENHAR LEÃO
========================================================= */

function drawLion(){

    /*
       LEÃO 3X MAIOR
    */

    const drawWidth=450;

    const drawHeight=246;


    let x=
        lion.x-
        150;


    /*
       Posição base no mármore
    */

    let y=
        groundY()-
        drawHeight+
        8;


    /*
       Movimento vertical real
       durante o salto
    */

    y+=
        (
            lion.y-
            (
                groundY()-
                lion.height
            )
        );


    /*
       Pequeno balanço
    */

    const bob=
        lion.grounded
        ? Math.sin(
            lion.frame*.2
        )*2
        : 0;


    y+=bob;


    ctx.save();


    /*
       Sombra do leão
    */

    ctx.beginPath();

    ctx.ellipse(
        lion.x+75,
        groundY()+5,
        88,
        12,
        0,
        0,
        Math.PI*2
    );


    ctx.fillStyle=
        "rgba(0,0,0,.28)";

    ctx.fill();


    const currentFrameIndex=
        Math.floor(
            lion.frame/2
        )%
        frameURLs.length;


    const currentImg=
        processedFrames[
            currentFrameIndex
        ] ||
        lionFrames[
            currentFrameIndex
        ];


    if(
        currentImg &&
        currentImg.complete
    ){

        ctx.globalCompositeOperation=
            "source-over";


        ctx.drawImage(
            currentImg,
            x,
            y,
            drawWidth,
            drawHeight
        );
    }


    ctx.restore();
}


/* =========================================================
   ALTAR COM TOCHA
========================================================= */

function drawObstacle(o){

    const x=o.x;

    const y=o.y;

    const w=o.width;

    const h=o.height;


    /*
       Base de sombra
    */

    ctx.fillStyle=
        "rgba(0,0,0,.18)";

    ctx.fillRect(
        x-8,
        groundY()-3,
        w+16,
        7
    );


    /*
       Degrau inferior
    */

    ctx.fillStyle=
        "#8b8177";

    ctx.fillRect(
        x-10,
        y+h-15,
        w+20,
        15
    );


    /*
       Degrau dourado
    */

    ctx.fillStyle=
        "#b79b5b";

    ctx.fillRect(
        x-14,
        y+h-20,
        w+28,
        7
    );


    /*
       Corpo do altar
    */

    const stone=
        ctx.createLinearGradient(
            x,
            y,
            x+w,
            y
        );


    stone.addColorStop(
        0,
        "#716963"
    );

    stone.addColorStop(
        .5,
        "#c5beb5"
    );

    stone.addColorStop(
        1,
        "#68615c"
    );


    ctx.fillStyle=stone;


    ctx.fillRect(
        x,
        y+25,
        w,
        h-35
    );


    /*
       topo
    */

    ctx.fillStyle=
        "#b8aea4";


    ctx.fillRect(
        x-8,
        y+17,
        w+16,
        13
    );


    /*
       detalhes babilônicos
    */

    ctx.strokeStyle=
        "#d2b66c";

    ctx.lineWidth=3;


    for(
        let xx=x+15;
        xx<x+w-5;
        xx+=22
    ){

        ctx.beginPath();

        ctx.moveTo(
            xx,
            y+42
        );

        ctx.lineTo(
            xx+8,
            y+55
        );

        ctx.lineTo(
            xx,
            y+68
        );

        ctx.stroke();
    }


    /*
       TOCHA
    */

    const torchX=
        x+w/2;

    const torchY=
        y+8;


    /*
       haste
    */

    ctx.fillStyle=
        "#593719";


    ctx.fillRect(
        torchX-4,
        torchY,
        8,
        27
    );


    /*
       chama externa
    */

    const flicker=
        Math.sin(
            o.flame
        )*
        4;


    ctx.save();


    ctx.translate(
        torchX,
        torchY-7
    );


    ctx.beginPath();

    ctx.moveTo(
        0,
        -30-flicker
    );

    ctx.bezierCurveTo(
        -18,
        -13,
        -14,
        2,
        0,
        8
    );

    ctx.bezierCurveTo(
        14,
        2,
        18,
        -13,
        0,
        -30-flicker
    );


    const fire=
        ctx.createRadialGradient(
            0,
            -10,
            2,
            0,
            -10,
            28
        );


    fire.addColorStop(
        0,
        "#fff7a0"
    );

    fire.addColorStop(
        .3,
        "#ffd33d"
    );

    fire.addColorStop(
        .7,
        "#ff8a18"
    );

    fire.addColorStop(
        1,
        "rgba(255,65,0,0)"
    );


    ctx.fillStyle=fire;

    ctx.fill();


    /*
       núcleo da chama
    */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -23-flicker
    );

    ctx.bezierCurveTo(
        -7,
        -10,
        -6,
        -1,
        0,
        4
    );

    ctx.bezierCurveTo(
        7,
        -1,
        7,
        -10,
        0,
        -23-flicker
    );


    ctx.fillStyle=
        "#fff4a0";

    ctx.fill();


    ctx.restore();
}


/* =========================================================
   MOEDA
========================================================= */

function drawCoin(c){

    const squash=
        Math.abs(
            Math.cos(
                c.spin
            )
        );


    ctx.save();


    ctx.translate(
        c.x,
        c.y
    );


    ctx.scale(
        .35+
        .65*squash,
        1
    );


    /*
       Aura
    */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        c.r+7,
        0,
        Math.PI*2
    );


    ctx.fillStyle=
        "rgba(255,205,70,.16)";

    ctx.fill();


    /*
       moeda
    */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        c.r,
        0,
        Math.PI*2
    );


    ctx.fillStyle=
        "#f2c34e";

    ctx.fill();


    ctx.strokeStyle=
        "#fff0a2";

    ctx.lineWidth=2;

    ctx.stroke();


    /*
       símbolo
    */

    ctx.fillStyle=
        "#875015";

    ctx.font=
        "bold 13px Arial";

    ctx.textAlign=
        "center";

    ctx.textBaseline=
        "middle";

    ctx.fillText(
        "𒀭",
        0,
        1
    );


    ctx.restore();
}


/* =========================================================
   PARTÍCULAS
========================================================= */

function drawParticles(){

    for(
        const p of particles
    ){

        ctx.globalAlpha=
            Math.max(
                0,
                p.life/.6
            );


        ctx.fillStyle=
            "#f4c45c";


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            3,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    ctx.globalAlpha=1;
}


/* =========================================================
   DESENHO
========================================================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawSky();

    drawDistantCity();

    drawGround();


    /*
       Moedas
    */

    for(
        const c of coins
    ){

        drawCoin(c);
    }


    /*
       Altares
    */

    for(
        const o of obstacles
    ){

        drawObstacle(o);
    }


    /*
       LEÃO
    */

    drawLion();


    drawParticles();


    /*
       Vinheta
    */

    const v=
        ctx.createRadialGradient(
            W/2,
            H/2,
            Math.min(W,H)*.25,
            W/2,
            H/2,
            Math.max(W,H)*.75
        );


    v.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );


    v.addColorStop(
        1,
        "rgba(0,0,0,.30)"
    );


    ctx.fillStyle=v;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}


/* =========================================================
   LOOP
========================================================= */

function loop(time){

    if(
        !running ||
        paused
    ){

        return;
    }


    let dt=
        (
            time-
            lastTime
        )/1000;


    lastTime=time;


    dt=
        Math.min(
            dt,
            .035
        );


    update(dt);

    draw();


    requestAnimationFrame(
        loop
    );
}


/* =========================================================
   PRIMEIRO DESENHO
========================================================= */

draw();
